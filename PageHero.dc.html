<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="background:#000;color:#fff;padding:calc(84px + clamp(40px,6vw,80px)) clamp(20px,4vw,48px) clamp(40px,6vw,70px);position:relative;overflow:hidden;">
  <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,0.04) 0px,rgba(255,255,255,0.04) 1px,transparent 1px,transparent 100px);pointer-events:none;"></div>
  <div style="max-width:1360px;margin:0 auto;position:relative;z-index:1;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
      <span style="width:8px;height:8px;background:#FEBB00;border-radius:50%;"></span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:2.5px;color:#FEBB00;">{{ eyebrow }}</span>
    </div>
    <h1 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(34px,6vw,64px);line-height:1.05;margin:0 0 18px;max-width:900px;">{{ title }}</h1>
    <p style="font-size:clamp(15px,1.4vw,17px);line-height:1.6;color:rgba(255,255,255,0.7);max-width:600px;margin:0;">{{ sub }}</p>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:340},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SECTION&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Subtitle text.&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
