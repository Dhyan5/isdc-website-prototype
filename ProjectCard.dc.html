<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ cardRef }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="position:relative;border:1px solid rgba(0,0,0,0.15);background:#fff;transition:transform .25s,border-color .25s,box-shadow .25s;height:100%;display:flex;flex-direction:column;overflow:hidden;" style-hover="transform:translateY(-6px);border-color:#000;box-shadow:0 16px 32px rgba(0,0,0,0.12);">
  <div class="__spot" style="position:absolute;inset:0;opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:1;background:radial-gradient(circle 180px at 50% 50%, rgba(254,187,0,0.14), transparent 70%);"></div>
  <div style="width:100%;aspect-ratio:16/10;background:repeating-linear-gradient(135deg,#111 0px,#111 10px,#000 10px,#000 20px);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;overflow:hidden;">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:rgba(255,255,255,0.4);letter-spacing:1px;">IMAGE PLACEHOLDER</span>
    <span style="position:absolute;top:14px;left:14px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:1px;background:{{ statusBg }};color:{{ statusColor }};padding:5px 10px;">{{ p.status }}</span>
  </div>
  <div style="padding:26px;display:flex;flex-direction:column;flex:1;position:relative;z-index:2;">
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#FEBB00;margin-bottom:10px;">{{ p.category }} · {{ p.duration }}</div>
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;line-height:1.25;margin-bottom:10px;">{{ p.name }}</div>
    <div style="font-size:14px;line-height:1.6;color:rgba(0,0,0,0.62);margin-bottom:18px;flex:1;">{{ p.desc }}</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;">
      <sc-for list="{{ p.stack }}" as="t" hint-placeholder-count="3">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;border:1px solid rgba(0,0,0,0.18);color:rgba(0,0,0,0.6);">{{ t }}</span>
      </sc-for>
    </div>
    <a href="javascript:void(0)" style="font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;letter-spacing:0.5px;border-bottom:2px solid #000;padding-bottom:3px;align-self:flex-start;">VIEW PROJECT →</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:460}}">
class Component extends DCLogic {
  cardRef = (el) => { this._el = el; };
  onMove = (e) => {
    if (!this._el) return;
    const glow = this._el.querySelector('.__spot');
    if (!glow) return;
    const r = this._el.getBoundingClientRect();
    glow.style.background = `radial-gradient(circle 200px at ${e.clientX - r.left}px ${e.clientY - r.top}px, rgba(254,187,0,0.14), transparent 70%)`;
    glow.style.opacity = '1';
  };
  onLeave = () => {
    if (!this._el) return;
    const glow = this._el.querySelector('.__spot');
    if (glow) glow.style.opacity = '0';
  };
  renderVals() {
    const ongoing = this.props.p.status === 'ongoing';
    return {
      p: this.props.p,
      statusBg: ongoing ? '#FEBB00' : '#000',
      statusColor: ongoing ? '#000' : '#FEBB00',
      cardRef: this.cardRef, onMove: this.onMove, onLeave: this.onLeave,
    };
  }
}
</script>
</body>
</html>
