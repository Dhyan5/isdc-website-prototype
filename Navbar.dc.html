<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<style>
  @keyframes isdc-fadeup{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
</style>
</helmet>
<nav style="{{ navBarStyle }}">
  <div style="max-width:1360px;margin:0 auto;padding:0 clamp(20px,4vw,48px);height:{{ navHeight }};display:flex;align-items:center;justify-content:space-between;">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;">
      <div style="width:38px;height:38px;background:#FEBB00;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:#000;flex-shrink:0;">IS</div>
      <div style="line-height:1;">
        <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#fff;letter-spacing:0.5px;">ISDC</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:#FEBB00;letter-spacing:1.5px;margin-top:1px;">CODE&nbsp;·&nbsp;CONNECT&nbsp;·&nbsp;CREATE</div>
      </div>
    </a>

    <sc-if value="{{ isDesktopNav }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:2px;">
        <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="7">
          <a href="{{ item.href }}" style="font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:{{ item.color }};padding:10px 14px;letter-spacing:0.2px;transition:color .2s;text-decoration:none;" style-hover="color:#FEBB00;">{{ item.label }}</a>
        </sc-for>
        <a href="Join.dc.html" style="margin-left:10px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;letter-spacing:0.5px;background:#FEBB00;color:#000;padding:12px 22px;border:2px solid #FEBB00;transition:transform .15s,background .2s;text-decoration:none;" style-hover="background:#fff;border-color:#fff;transform:translateY(-2px);">JOIN US</a>
      </div>
    </sc-if>

    <sc-if value="{{ isMobileNav }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggleMobileMenu }}" aria-label="Menu" style="width:42px;height:42px;background:transparent;border:2px solid #FEBB00;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;">
        <span style="{{ hamburgerLine1 }}"></span>
        <span style="{{ hamburgerLine2 }}"></span>
        <span style="{{ hamburgerLine3 }}"></span>
      </button>
    </sc-if>
  </div>

  <sc-if value="{{ mobileMenuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="background:#000;border-top:1px solid rgba(255,255,255,0.12);padding:8px clamp(20px,4vw,48px) 28px;display:flex;flex-direction:column;animation:isdc-fadeup .25s ease both;">
      <sc-for list="{{ navItems }}" as="item2" hint-placeholder-count="7">
        <a href="{{ item2.href }}" style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;color:{{ item2.color }};padding:14px 4px;border-bottom:1px solid rgba(255,255,255,0.08);text-decoration:none;">{{ item2.label }}</a>
      </sc-for>
      <a href="Join.dc.html" style="margin-top:18px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;letter-spacing:0.5px;background:#FEBB00;color:#000;padding:16px;text-decoration:none;">JOIN US</a>
    </div>
  </sc-if>
</nav>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:84},&quot;current&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">

class Component extends DCLogic {
  state = { mobileMenuOpen: false, scrolled: false, viewportWidth: (typeof window!=='undefined'?window.innerWidth:1440), navData: [] };

  componentDidMount() {
    this._onResize = () => this.setState({ viewportWidth: window.innerWidth });
    this._onScroll = () => {
      const s = window.scrollY > 30;
      if (s !== this.state.scrolled) this.setState({ scrolled: s });
    };
    window.addEventListener('resize', this._onResize);
    window.addEventListener('scroll', this._onScroll);
    import('./data.js').then((m) => this.setState({ navData: m.navItems }));
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this._onResize);
    window.removeEventListener('scroll', this._onScroll);
  }
  toggleMobileMenu = () => this.setState((s) => ({ mobileMenuOpen: !s.mobileMenuOpen }));

  renderVals() {
    const s = this.state;
    const isMobile = s.viewportWidth < 860;
    const current = this.props.current || 'home';
    const navItems = s.navData.map((n) => ({ label: n.label, href: n.href, active: n.key === current, color: n.key === current ? '#FEBB00' : '#fff' }));
    const navHeightPx = isMobile ? 64 : 84;
    return {
      isDesktopNav: !isMobile, isMobileNav: isMobile,
      mobileMenuOpen: s.mobileMenuOpen, toggleMobileMenu: this.toggleMobileMenu,
      navItems,
      navBarStyle: `position:sticky;top:0;z-index:200;background:${s.scrolled?'rgba(0,0,0,0.92)':'#000'};backdrop-filter:blur(10px);box-shadow:${s.scrolled?'0 8px 24px rgba(0,0,0,0.35)':'none'};transition:box-shadow .3s;`,
      navHeight: navHeightPx + 'px',
      hamburgerLine1: `width:20px;height:2px;background:#fff;transition:transform .25s;${s.mobileMenuOpen?'transform:translateY(3.5px) rotate(45deg);':''}`,
      hamburgerLine2: `width:20px;height:2px;background:#fff;transition:opacity .2s;${s.mobileMenuOpen?'opacity:0;':''}`,
      hamburgerLine3: `width:20px;height:2px;background:#fff;transition:transform .25s;${s.mobileMenuOpen?'transform:translateY(-3.5px) rotate(-45deg);':''}`,
    };
  }
}

</script>
</body>
</html>
