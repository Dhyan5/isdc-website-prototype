<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  a{color:#000;text-decoration:none;}
  a:hover{color:#FEBB00;}
  @keyframes isdc-fadeup{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  ::selection{background:#FEBB00;color:#000;}
</style>
</helmet>
<div ref="{{ rootRef }}" style="font-family:'Inter',sans-serif;color:#000;background:#fff;overflow-x:hidden;animation:isdc-fadeup .5s ease both;">
  <dc-import name="Navbar" current="announcements" hint-size="100%,84px"></dc-import>
  <dc-import name="PageHero" eyebrow="ANNOUNCEMENTS" title="Community updates, as they happen." sub="Official notices, deadlines and news from the ISDC core team." hint-size="100%,340px"></dc-import>
  <section style="background:#fff;padding:clamp(40px,6vw,70px) clamp(20px,4vw,48px) clamp(80px,10vw,130px);">
    <div style="max-width:820px;margin:0 auto;">
      <sc-for list="{{ announcements }}" as="an" hint-placeholder-count="3">
        <div data-reveal="1" data-reveal-idx="{{ $index }}" style="opacity:0;transform:translateY(20px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);border-bottom:1px solid rgba(0,0,0,0.12);padding:28px 0;display:flex;gap:20px;">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(0,0,0,0.45);white-space:nowrap;padding-top:3px;">{{ an.tag }}</div>
          <div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin-bottom:6px;">{{ an.title }}</div>
            <div style="font-size:14.5px;line-height:1.6;color:rgba(0,0,0,0.6);">{{ an.body }}</div>
          </div>
        </div>
      </sc-for>
      <div style="text-align:center;padding:56px 0 0;">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:1px;color:rgba(0,0,0,0.4);">— placeholders shown · live feed connects here —</div>
      </div>
    </div>
  </section>
  <dc-import name="Footer" hint-size="100%,420px"></dc-import>
  <dc-import name="ChatBot" hint-size="64px,64px" style="position:fixed;bottom:24px;right:24px;z-index:999;"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { data: null };
  componentDidMount() { import('./data.js').then((m) => { this._dataMod = m; this.setState({ data: m }, () => this._wireAnim()); }); }
  componentWillUnmount() { if (this._io) this._io.disconnect(); }
  rootRef = (el) => { this._rootEl = el; this._wireAnim(); };
  _wireAnim() {
    if (!this._rootEl || !this._dataMod || this._wired) return;
    this._wired = true;
    requestAnimationFrame(() => { this._io = this._dataMod.setupReveal(this._rootEl); });
  }
  renderVals() { return { rootRef: this.rootRef, announcements: this.state.data ? this.state.data.announcementPlaceholders : [] }; }
}

</script>
</body>
</html>
