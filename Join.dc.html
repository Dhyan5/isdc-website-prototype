<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff;-webkit-font-smoothing:antialiased;}
  *{box-sizing:border-box;}
  a{color:#000;text-decoration:none;}
  a:hover{color:#FEBB00;}
  @keyframes isdc-fadeup{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  ::selection{background:#FEBB00;color:#000;}
  @media (max-width:859px){.isdc-form-fields{grid-template-columns:1fr!important;}}
</style>
</helmet>
<div ref="{{ rootRef }}" style="font-family:'Inter',sans-serif;color:#000;background:#fff;overflow-x:hidden;animation:isdc-fadeup .5s ease both;">
  <dc-import name="Navbar" current="join" hint-size="100%,84px"></dc-import>
  <dc-import name="PageHero" eyebrow="JOIN ISDC" title="Start your journey." sub="Become part of a thriving community of developers, innovators and tech enthusiasts." hint-size="100%,300px"></dc-import>
  <section style="background:#fff;padding:clamp(40px,6vw,70px) clamp(20px,4vw,48px) clamp(80px,10vw,130px);">
    <div style="max-width:1360px;margin:0 auto;display:grid;grid-template-columns:{{ gridCols }};gap:clamp(40px,6vw,80px);">
      <div>
        <h3 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;margin:0 0 20px;">Why join?</h3>
        <sc-for list="{{ whyCards }}" as="wj" hint-placeholder-count="4">
          <div data-reveal="1" data-reveal-idx="{{ $index }}" style="opacity:0;transform:translateY(20px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);display:flex;gap:16px;padding:16px 0;border-bottom:1px solid rgba(0,0,0,0.1);">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;color:#FEBB00;flex-shrink:0;">{{ wj.num }}</div>
            <div>
              <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;margin-bottom:4px;">{{ wj.title }}</div>
              <div style="font-size:14px;color:rgba(0,0,0,0.6);line-height:1.55;">{{ wj.desc }}</div>
            </div>
          </div>
        </sc-for>
      </div>
      <div>
        <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
          <div style="background:#000;color:#fff;padding:48px;text-align:center;animation:isdc-fadeup .4s ease both;">
            <div style="width:52px;height:52px;border:2px solid #FEBB00;border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;color:#FEBB00;font-family:'Space Grotesk',sans-serif;font-weight:700;">✓</div>
            <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin-bottom:12px;">Welcome aboard.</div>
            <div style="font-size:14.5px;color:rgba(255,255,255,0.7);">Your application is in. We'll reach out to {{ form.email }} with next steps.</div>
          </div>
        </sc-if>
        <sc-if value="{{ notSubmitted }}" hint-placeholder-val="{{ true }}">
          <form onSubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:18px;background:#000;padding:36px;">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#FEBB00;margin-bottom:-4px;">MEMBERSHIP APPLICATION</div>
            <div class="isdc-form-fields" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
              <input value="{{ form.name }}" onChange="{{ setName }}" required="{{ true }}" placeholder="Full Name *" style="font-family:'Inter',sans-serif;font-size:14.5px;padding:14px 15px;border:1.5px solid rgba(255,255,255,0.25);background:#000;color:#fff;outline:none;transition:border-color .2s;" style-focus="border-color:#FEBB00;" />
              <input value="{{ form.usn }}" onChange="{{ setUsn }}" placeholder="USN / Roll No." style="font-family:'Inter',sans-serif;font-size:14.5px;padding:14px 15px;border:1.5px solid rgba(255,255,255,0.25);background:#000;color:#fff;outline:none;transition:border-color .2s;" style-focus="border-color:#FEBB00;" />
            </div>
            <input value="{{ form.email }}" onChange="{{ setEmail }}" required="{{ true }}" type="email" placeholder="Email *" style="font-family:'Inter',sans-serif;font-size:14.5px;padding:14px 15px;border:1.5px solid rgba(255,255,255,0.25);background:#000;color:#fff;outline:none;transition:border-color .2s;" style-focus="border-color:#FEBB00;" />
            <select value="{{ form.domain }}" onChange="{{ setDomain }}" style="font-family:'Inter',sans-serif;font-size:14.5px;padding:14px 15px;border:1.5px solid rgba(255,255,255,0.25);background:#000;color:#fff;outline:none;">
              <option value="">Interested Domain</option>
              <sc-for list="{{ allDomains }}" as="dm" hint-placeholder-count="10">
                <option value="{{ dm }}">{{ dm }}</option>
              </sc-for>
            </select>
            <textarea value="{{ form.message }}" onChange="{{ setMessage }}" placeholder="Why do you want to join ISDC?" rows="4" style="font-family:'Inter',sans-serif;font-size:14.5px;padding:14px 15px;border:1.5px solid rgba(255,255,255,0.25);background:#000;color:#fff;outline:none;resize:vertical;transition:border-color .2s;" style-focus="border-color:#FEBB00;"></textarea>
            <button type="submit" style="font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;letter-spacing:0.5px;background:#FEBB00;color:#000;padding:18px;border:2px solid #FEBB00;transition:transform .15s;" style-hover="transform:translateY(-2px);">SUBMIT APPLICATION →</button>
          </form>
        </sc-if>
      </div>
    </div>
  </section>
  <dc-import name="Footer" hint-size="100%,420px"></dc-import>
  <dc-import name="ChatBot" hint-size="64px,64px" style="position:fixed;bottom:24px;right:24px;z-index:999;"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

class Component extends DCLogic {
  state = { data: null, w: (typeof window!=='undefined'?window.innerWidth:1440), form: {name:'',email:'',usn:'',domain:'',message:''}, submitted: false };
  componentDidMount() {
    this._onResize = () => this.setState({ w: window.innerWidth });
    window.addEventListener('resize', this._onResize);
    import('./data.js').then((m) => { this._dataMod = m; this.setState({ data: m }, () => this._wireAnim()); });
  }
  componentWillUnmount() { window.removeEventListener('resize', this._onResize); if (this._io) this._io.disconnect(); }
  rootRef = (el) => { this._rootEl = el; this._wireAnim(); };
  _wireAnim() {
    if (!this._rootEl || !this._dataMod || this._wired) return;
    this._wired = true;
    requestAnimationFrame(() => { this._io = this._dataMod.setupReveal(this._rootEl); });
  }
  setField = (field) => (e) => this.setState((s) => ({ form: { ...s.form, [field]: e.target.value } }));
  submit = (e) => { e.preventDefault(); this.setState({ submitted: true }); };
  renderVals() {
    const d = this.state.data;
    const isMobile = this.state.w < 860;
    return {
      rootRef: this.rootRef,
      whyCards: d ? d.whyCards : [],
      allDomains: d ? [...d.domainsTechnical, ...d.domainsCreative] : [],
      gridCols: isMobile ? '1fr' : '0.8fr 1.2fr',
      form: this.state.form, submitted: this.state.submitted, notSubmitted: !this.state.submitted,
      setName: this.setField('name'), setUsn: this.setField('usn'), setEmail: this.setField('email'),
      setDomain: this.setField('domain'), setMessage: this.setField('message'), submit: this.submit,
    };
  }
}

</script>
</body>
</html>
