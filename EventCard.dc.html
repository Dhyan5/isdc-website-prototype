<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ cardRef }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.15);background:#000;color:#fff;padding:28px;display:flex;flex-direction:column;transition:transform .25s,border-color .25s;" style-hover="transform:translateY(-6px);border-color:#FEBB00;">
  <div class="__spot" style="position:absolute;inset:0;opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:0;background:radial-gradient(circle 180px at 50% 50%, rgba(254,187,0,0.16), transparent 70%);"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;position:relative;z-index:2;">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:1px;color:#FEBB00;">{{ e.category }}</span>
    <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.5px;padding:4px 9px;background:{{ statusBg }};color:{{ statusColor }};">{{ statusLabel }}</span>
  </div>
  <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;line-height:1.25;margin-bottom:10px;position:relative;z-index:2;">{{ e.name }}</div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(255,255,255,0.55);margin-bottom:14px;position:relative;z-index:2;">{{ e.date }}</div>
  <div style="font-size:14px;line-height:1.6;color:rgba(255,255,255,0.65);margin-bottom:20px;position:relative;z-index:2;">{{ e.desc }}</div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;position:relative;z-index:2;">
    <sc-for list="{{ e.tags }}" as="t" hint-placeholder-count="2">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;padding:5px 9px;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.65);">{{ t }}</span>
    </sc-for>
  </div>
  <a href="javascript:void(0)" style="font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12.5px;letter-spacing:0.5px;color:#FEBB00;border-bottom:2px solid #FEBB00;padding-bottom:3px;align-self:flex-start;position:relative;z-index:2;">DETAILS →</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:340}}">
class Component extends DCLogic {
  cardRef = (el) => { this._el = el; };
  onMove = (e) => {
    if (!this._el) return;
    const glow = this._el.querySelector('.__spot');
    if (!glow) return;
    const r = this._el.getBoundingClientRect();
    glow.style.background = `radial-gradient(circle 200px at ${e.clientX - r.left}px ${e.clientY - r.top}px, rgba(254,187,0,0.16), transparent 70%)`;
    glow.style.opacity = '1';
  };
  onLeave = () => {
    if (!this._el) return;
    const glow = this._el.querySelector('.__spot');
    if (glow) glow.style.opacity = '0';
  };
  renderVals() {
    const st = this.props.e.status;
    return {
      e: this.props.e,
      statusLabel: st === 'upcoming' ? 'UPCOMING' : 'PAST',
      statusBg: st === 'upcoming' ? '#FEBB00' : 'rgba(255,255,255,0.12)',
      statusColor: st === 'upcoming' ? '#000' : 'rgba(255,255,255,0.7)',
      cardRef: this.cardRef, onMove: this.onMove, onLeave: this.onLeave,
    };
  }
}
</script>
</body>
</html>
