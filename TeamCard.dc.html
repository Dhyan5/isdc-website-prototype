<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ cardRef }}" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" style="position:relative;overflow:hidden;background:#fff;border:1px solid rgba(0,0,0,0.12);text-align:left;transition:background .25s,border-color .25s;" style-hover="background:#000;border-color:rgba(255,255,255,0.15);">
  <div class="__spot" style="position:absolute;inset:0;opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:0;background:radial-gradient(circle 160px at 50% 50%, rgba(254,187,0,0.14), transparent 70%);"></div>
  <div aria-label="Team member image placeholder" style="width:100%;aspect-ratio:16/10;background:repeating-linear-gradient(135deg,#111 0px,#111 10px,#000 10px,#000 20px);display:flex;align-items:center;justify-content:center;position:relative;z-index:2;">
    <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:42px;color:#FEBB00;">{{ initials }}</span>
  </div>
  <div style="padding:22px;position:relative;z-index:2;">
    <div style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin-bottom:6px;{{ nameColor }}">{{ m.name }}</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#FEBB00;margin-bottom:16px;">{{ m.role }}</div>
    <a href="{{ m.linkedin }}" target="_blank" style="{{ linkStyle }}">LINKEDIN →</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:260}}">
class Component extends DCLogic {
  cardRef = (el) => { this._el = el; };
  onMove = (e) => {
    if (!this._el) return;
    const glow = this._el.querySelector('.__spot');
    if (!glow) return;
    const r = this._el.getBoundingClientRect();
    glow.style.background = `radial-gradient(circle 160px at ${e.clientX - r.left}px ${e.clientY - r.top}px, rgba(254,187,0,0.14), transparent 70%)`;
    glow.style.opacity = '1';
  };
  onLeave = () => {
    if (!this._el) return;
    const glow = this._el.querySelector('.__spot');
    if (glow) glow.style.opacity = '0';
  };
  renderVals() {
    const m = this.props.m || {};
    const parts = (m.name||'').split(' ').filter(Boolean);
    const initials = ((parts[0]||'')[0]||'') + ((parts[1]||'')[0]||'');
    return {
      m, initials: initials.toUpperCase(),
      nameColor: 'color:#000;',
      linkStyle: "font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.5px;color:rgba(0,0,0,0.5);",
      cardRef: this.cardRef, onMove: this.onMove, onLeave: this.onLeave,
    };
  }
}
</script>
</body>
</html>
